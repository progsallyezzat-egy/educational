<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        /* Basic modern navigation styling */
        nav {
            background-color: #1a1a1a;
            padding: 1rem;
            display: flex;
            gap: 1.5rem;
            border-radius: 8px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-family: system-ui, sans-serif;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        nav a:hover {
            background-color: #333333;
        }
    </style>
</head>
